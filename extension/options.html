<!DOCTYPE html>
<html lang="en">
<head><meta charset="utf-8"><title>safe-url-guard settings</title><link rel="stylesheet" href="pages.css"></head>
<body class="options">
  <h1 data-i18n="opt_title">safe-url-guard settings</h1>

  <section>
    <h2 data-i18n="opt_lang">Language</h2>
    <select id="lang">
      <option value="en">English</option>
      <option value="zh">中文（简体）</option>
    </select>
  </section>

  <section>
    <h2 data-i18n="opt_transfer_h">"Stop and think before you transfer" checklist</h2>
    <p class="muted" data-i18n="opt_transfer_p"></p>
    <label><input type="checkbox" id="transferCheck"> <span data-i18n="opt_on">Turn on</span></label>
  </section>

  <section>
    <h2 data-i18n="opt_deny_h">Custom blocklist</h2>
    <p class="muted" data-i18n="opt_deny_p"></p>
    <textarea id="denylist" spellcheck="false"></textarea>
  </section>

  <section>
    <h2 data-i18n="opt_allow_h">Allowlist (exceptions)</h2>
    <p class="muted" data-i18n="opt_allow_p"></p>
    <textarea id="allowlist" spellcheck="false"></textarea>
  </section>

  <button id="save" data-i18n="opt_save">Save</button> <span id="msg" class="muted"></span>
<script src="i18n.js"></script>
<script src="options.js"></script>
</body>
</html>

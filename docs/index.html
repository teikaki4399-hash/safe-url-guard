<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Scam Checker | safe-url-guard</title>
<meta name="description" content="Check suspicious messages, links and QR codes for investment, job, romance and dating scams and phishing sites. 检查可疑消息、网址和二维码。">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header>
  <div class="lang-switch" role="group" aria-label="Language / 语言">
    <button type="button" data-lang="en">English</button>
    <button type="button" data-lang="zh">中文</button>
  </div>
  <h1 data-i18n="h1">Scam Checker</h1>
  <p class="lead" data-i18n="lead">Paste a suspicious message, link or QR code here and check it before you reply, pay or open anything.</p>
</header>

<main>
  <nav class="tabs" role="tablist">
    <button role="tab" aria-selected="true" data-tab="msg" data-i18n="tab_msg">Message</button>
    <button role="tab" aria-selected="false" data-tab="url" data-i18n="tab_url">Link</button>
    <button role="tab" aria-selected="false" data-tab="qr" data-i18n="tab_qr">QR code</button>
  </nav>

  <section id="tab-msg" class="panel">
    <label for="msg-input" data-i18n="msg_label">Paste the SMS, LINE, e-mail or DM you received:</label>
    <textarea id="msg-input" rows="7" data-i18n-ph="msg_ph"></textarea>
    <button id="msg-btn" class="primary" data-i18n="msg_btn">Check message</button>
    <div id="msg-result" class="result" aria-live="polite"></div>
  </section>

  <section id="tab-url" class="panel" hidden>
    <label for="url-input" data-i18n="url_label">Enter a link:</label>
    <input id="url-input" type="text" inputmode="url" placeholder="https://example.com/login">
    <label class="check"><input id="url-rdap" type="checkbox" checked> <span data-i18n="url_rdap"></span></label>
    <button id="url-btn" class="primary" data-i18n="url_btn">Check link</button>
    <div id="url-result" class="result" aria-live="polite"></div>
  </section>

  <section id="tab-qr" class="panel" hidden>
    <label for="qr-input" data-i18n="qr_label">Choose a QR-code image (screenshot or photo):</label>
    <input id="qr-input" type="file" accept="image/*">
    <p class="hint" data-i18n="qr_hint"></p>
    <div id="qr-result" class="result" aria-live="polite"></div>
  </section>

  <aside class="box">
    <h2 data-i18n="signs_h">Common warning signs</h2>
    <ul>
      <li data-i18n="sign_inv"></li>
      <li data-i18n="sign_job"></li>
      <li data-i18n="sign_rom"></li>
      <li data-i18n="sign_hook"></li>
      <li data-i18n="sign_common"></li>
    </ul>
    <h2 data-i18n="help_h">If you think you have been scammed</h2>
    <ul>
      <li data-i18n="help_stop"></li>
      <li data-i18n="help_jp"></li>
      <li data-i18n="help_cn"></li>
      <li data-i18n="help_other"></li>
      <li data-i18n="help_recovery"></li>
    </ul>
  </aside>

  <p class="privacy" data-i18n="privacy"></p>
  <p class="privacy" data-i18n="disclaimer"></p>
</main>

<footer>
  <a href="https://github.com/teikaki4399-hash/safe-url-guard">GitHub</a> · GPL-3.0 ·
  <span data-i18n="footer_qr">QR decoding by</span> <a href="https://github.com/cozmo/jsQR">jsQR</a> (Apache-2.0)
</footer>

<script src="i18n.js"></script>
<script src="vendor/jsQR.js"></script>
<script src="scam_core.js"></script>
<script src="app.js"></script>
</body>
</html>
